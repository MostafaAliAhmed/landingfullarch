<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#006c35">
<title>د. مصطفى جلال لطب الأسنان | زراعة فك كامل</title>
<meta name="description" content="للاستفسار وحجز استشارة زراعة فك كامل، اتصل بنا أو راسلنا على الواتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:only light;
    --soft:rgba(255,255,255,.82);
    --gold:#f0d78c;
    --wa:#25d366;
    --wa-ink:#06301a;
    --d:clamp(200px,33.33vh,360px);
    --d:clamp(200px,33.33svh,360px);
    --t:215px;
  }
  *{box-sizing:border-box;margin:0}
  html{background:#006c35}
  body{
    background:#006c35;color:#fff;min-height:100vh;
    font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:0;
  }

  /* gentle waving-cloth shading */
  .wave{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#006c35}
  .wave i{position:absolute;inset:-20% -40%;display:block}
  .wave i:nth-child(1){
    background:repeating-linear-gradient(100deg,rgba(0,0,0,0) 0,rgba(0,0,0,.18) 70px,rgba(0,0,0,0) 150px,rgba(255,255,255,.09) 230px,rgba(255,255,255,0) 300px);
    animation:drift 16s linear infinite;
  }
  .wave i:nth-child(2){
    background:repeating-linear-gradient(80deg,rgba(255,255,255,0) 0,rgba(255,255,255,.07) 90px,rgba(255,255,255,0) 180px,rgba(0,0,0,.12) 260px,rgba(0,0,0,0) 340px);
    animation:drift2 26s linear infinite reverse;
  }
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(300px)}}
  @keyframes drift2{from{transform:translateX(0) skewY(-3deg)}to{transform:translateX(340px) skewY(-3deg)}}
  @media (prefers-reduced-motion:reduce){.wave i{animation:none!important}}

  .page{
    position:relative;z-index:1;max-width:520px;margin:0 auto;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;
    padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  }

  /* teeth: edge to edge, no frame, melts into the green */
  .teeth{
    display:block;width:100%;height:100%;object-fit:cover;object-position:center 55%;transform:scaleX(-1);
    -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
  }

  /* identity row: text on the right, doctor on the left */
  h1{font-size:clamp(36px,10vw,46px);line-height:1.2;font-weight:700;text-align:center;margin-bottom:-6px}
  /* middle of the page: name + title, centred */
  .who{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 20px;
    margin-top:calc(var(--d) - var(--t) - 30px);
    position:relative;z-index:3;
  }
  .name{font-size:clamp(36px,10vw,46px);line-height:1.2;font-weight:700}
  .sub{font-size:19px;line-height:1.7;color:rgba(255,255,255,.92);text-wrap:balance}
  .name + .sub{margin-top:8px}
  .who .lead{margin-top:18px;font-size:17px;color:var(--soft)}
  .hero{position:relative;height:var(--t)}
  .doctor{
    position:absolute;top:8px;right:6px;z-index:2;
    height:var(--d);width:auto;display:block;
    -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));
  }

  .body{flex:0 0 auto;padding:0 20px;display:flex;flex-direction:column;align-items:stretch;gap:22px}
  .lower{margin-top:auto;display:flex;flex-direction:column;gap:18px}
  .loc{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:18px;font-weight:600;margin-bottom:6px}
  .loc svg{width:22px;height:22px;flex:none}
  .lead{font-size:17px;line-height:1.7}

  .offer{
    display:block;text-align:center;text-decoration:none;color:var(--gold);
    font-size:19px;font-weight:700;line-height:1.6;
  }
  .offer span{display:block;margin-top:2px;font-size:14px;font-weight:400;color:var(--soft)}
  .offer:focus-visible{outline:3px solid #fff;outline-offset:4px}

  .cta{display:flex;flex-direction:column;gap:6px}
  .wabtn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    min-height:62px;border-radius:999px;text-decoration:none;
    background:var(--wa);color:var(--wa-ink);font-size:20px;font-weight:700;
  }
  .wabtn svg{width:28px;height:28px;flex:none}
  .call{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:56px;color:#fff;text-decoration:none;font-size:18px;font-weight:600;
  }
  .call svg{width:24px;height:24px;flex:none}
  .call .num{direction:ltr;unicode-bidi:isolate;font-weight:400;opacity:.9;text-decoration:underline;text-underline-offset:4px}
  .wabtn:active{transform:scale(.99)}
  .wabtn:focus-visible,.call:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .sticky{
    position:fixed;z-index:10;inset:auto 0 0 0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to bottom,rgba(0,108,53,0),#006c35 38%);
    pointer-events:none;transition:opacity .2s;
  }
  .sticky.hide{opacity:0;visibility:hidden}
  .sticky a{
    pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:12px;
    max-width:480px;margin:0 auto;min-height:58px;border-radius:999px;
    background:var(--wa);color:var(--wa-ink);text-decoration:none;
    font-size:19px;font-weight:700;box-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  .sticky svg{width:28px;height:28px;flex:none}
  .sticky a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
